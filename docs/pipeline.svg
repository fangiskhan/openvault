<text class="num" x="47" y="287" text-anchor="middle">1</text>
<text class="ttl" x="72" y="287">THE PROMPT</text>
<text class="det" x="72" y="308">&#8220;add retries&#8221;</text></g>
<g><rect x="31" y="366" width="234" height="74" fill="#0a0a0a"/>
<rect x="24" y="359" width="234" height="74" fill="#fff" stroke="#0a0a0a" stroke-width="3"/>
