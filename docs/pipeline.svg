<text class="hdr" x="42" y="59">OPENVAULT</text>
<text class="sub" x="24" y="106">One prompt reaches your repo as a reviewed change, and nobody relays a message.</text>
<text class="sub" x="24" y="128" fill="#555">The contributor cannot push. Their agent proposes; you approve; you push.</text>
<rect x="31" y="163" width="234" height="46" fill="#0a0a0a"/>
<rect x="24" y="156" width="234" height="46" fill="#e5ff1a" stroke="#0a0a0a" stroke-width="3"/>
<text class="lane" x="40" y="185">CONTRIBUTOR</text>
<text class="lanesub" x="24" y="224">cannot push to your repo</text>
<rect x="289" y="163" width="234" height="46" fill="#0a0a0a"/>
<rect x="282" y="156" width="234" height="46" fill="#00e5ff" stroke="#0a0a0a" stroke-width="3"/>
<text class="lane" x="298" y="185">THE VAULT</text>
<text class="lanesub" x="282" y="224">shared memory</text>
<rect x="547" y="163" width="234" height="46" fill="#0a0a0a"/>
<rect x="540" y="156" width="234" height="46" fill="#ff1a66" stroke="#0a0a0a" stroke-width="3"/>
<text class="lane" x="556" y="185">OWNER</text>
<text class="lanesub" x="540" y="224">reviews, then pushes</text>
<rect x="805" y="163" width="138" height="46" fill="#0a0a0a"/>
<rect x="798" y="156" width="138" height="46" fill="#d4d4d4" stroke="#0a0a0a" stroke-width="3"/>
<text class="lane" x="814" y="185">GIT</text>
<text class="lanesub" x="798" y="224">your repo</text>
