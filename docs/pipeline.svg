<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d">
  <title id="t">How work moves through OpenVault</title>
  <desc id="d">A swim-lane diagram in three rows. Your agent prompts, briefs itself, reads the code mirror, announces work and proposes a change. The vault holds state, the mirror and the review queue. Their agent reviews, applies the approved change in its own checkout and pushes; CI mirrors it back. The vault never writes to git.</desc>

  <defs>
    <!-- The SPX language: 3px ink borders, a hard two-colour offset shadow,
         zero rounding. No gradients, no blur — every edge is a decision. -->
    <style>
      .ink   { fill: #0a0a0a; }
      .card  { fill: #ffffff; stroke: #0a0a0a; stroke-width: 3; }
      .shade { fill: #0a0a0a; }
      .wire  { fill: none; stroke: #0a0a0a; stroke-width: 3; }
      .ttl   { font: 700 15px "Segoe UI", Inter, system-ui, sans-serif; letter-spacing: 1.6px; fill: #0a0a0a; }
      .sub   { font: 12px ui-monospace, "Cascadia Mono", Menlo, monospace; fill: #555; }
      .lane  { font: 800 15px "Segoe UI", Inter, system-ui, sans-serif; letter-spacing: 2.4px; fill: #0a0a0a; }
      .step  { font: 800 13px "Segoe UI", Inter, system-ui, sans-serif; fill: #0a0a0a; }
      .note  { font: 13px ui-monospace, "Cascadia Mono", Menlo, monospace; fill: #0a0a0a; }
      .hdr   { font: 800 30px "Segoe UI", Inter, system-ui, sans-serif; letter-spacing: 6px; fill: #0a0a0a; }
    </style>
  </defs>

  <rect width="1600" height="700" fill="#f5f5f5"/>

  <!-- faint graph paper -->
  <g stroke="#e6e6e6" stroke-width="1">
    <path d="M0 0 H1600 M0 50 H1600 M0 100 H1600 M0 150 H1600 M0 200 H1600 M0 250 H1600 M0 300 H1600 M0 350 H1600 M0 400 H1600 M0 450 H1600 M0 500 H1600 M0 550 H1600 M0 600 H1600 M0 650 H1600"/>
    <path d="M0 0 V700 M50 0 V700 M100 0 V700 M150 0 V700 M200 0 V700 M250 0 V700 M300 0 V700 M350 0 V700 M400 0 V700 M450 0 V700 M500 0 V700 M550 0 V700 M600 0 V700 M650 0 V700 M700 0 V700 M750 0 V700 M800 0 V700 M850 0 V700 M900 0 V700 M950 0 V700 M1000 0 V700 M1050 0 V700 M1100 0 V700 M1150 0 V700 M1200 0 V700 M1250 0 V700 M1300 0 V700 M1350 0 V700 M1400 0 V700 M1450 0 V700 M1500 0 V700 M1550 0 V700"/>
  </g>

  <!-- header, with the two-colour offset that is the signature of the look -->
  <text class="hdr" x="46" y="62" fill="#00e5ff">OPENVAULT</text>
  <text class="hdr" x="42" y="58" fill="#ff1a66">OPENVAULT</text>
  <text class="hdr" x="38" y="54">OPENVAULT</text>
  <text class="note" x="40" y="88">one prompt → reviewed code, and two agents on one project with no human relaying between them</text>

  <!-- ---------- lane labels ---------- -->
  <g>
    <rect x="44" y="164" width="196" height="44" fill="#0a0a0a"/>
    <rect x="38" y="158" width="196" height="44" fill="#e5ff1a" stroke="#0a0a0a" stroke-width="3"/>
    <text class="lane" x="56" y="186">YOUR AGENT</text>

    <rect x="44" y="344" width="196" height="44" fill="#0a0a0a"/>
    <rect x="38" y="338" width="196" height="44" fill="#00e5ff" stroke="#0a0a0a" stroke-width="3"/>
    <text class="lane" x="56" y="366">THE VAULT</text>

    <rect x="44" y="524" width="196" height="44" fill="#0a0a0a"/>
    <rect x="38" y="518" width="196" height="44" fill="#ff1a66" stroke="#0a0a0a" stroke-width="3"/>
    <text class="lane" x="56" y="546">THEIR AGENT</text>
  </g>

  <!-- ---------- wires, drawn under the cards ---------- -->
  <g class="wire">
    <!-- prompt → brief : lane 1 down to lane 2 -->
    <path d="M420 180 H452 V360 H478"/>
    <!-- brief → read (same lane) -->
    <path d="M630 360 H668"/>
    <!-- read → announce : up to lane 1 -->
    <path d="M820 360 H852 V180 H878"/>
    <!-- announce → suggest (same lane) -->
    <path d="M1030 180 H1068"/>
    <!-- suggest → queue : down to lane 2 -->
    <path d="M1220 180 H1252 V360 H1278"/>
    <!-- queue → owner applies : down to lane 3 -->
    <path d="M1430 360 H1462 V540 H1300 V540"/>
    <!-- owner applies → CI mirrors : back up to lane 2 -->
    <path d="M1090 540 H1058 V420"/>
  </g>

  <!-- ---------- cards ---------- -->
  <!-- YOUR AGENT lane -->
  <g>
    <rect x="274" y="156" width="152" height="76" class="shade"/>
    <rect x="268" y="150" width="152" height="76" class="card"/>
    <rect x="268" y="150" width="152" height="8" fill="#e5ff1a"/>
    <text class="step" x="282" y="186">YOU PROMPT</text>
    <text class="sub"  x="282" y="208">“add retries”</text>
  </g>
  <g>
    <rect x="884" y="156" width="152" height="76" class="shade"/>
    <rect x="878" y="150" width="152" height="76" class="card"/>
    <rect x="878" y="150" width="152" height="8" fill="#e5ff1a"/>
    <text class="step" x="892" y="186">ANNOUNCE_WORK</text>
    <text class="sub"  x="892" y="208">warns on overlap</text>
  </g>
  <g>
    <rect x="1074" y="156" width="152" height="76" class="shade"/>
    <rect x="1068" y="150" width="152" height="76" class="card"/>
    <rect x="1068" y="150" width="152" height="8" fill="#e5ff1a"/>
    <text class="step" x="1082" y="186">SUGGEST_CHANGE</text>
    <text class="sub"  x="1082" y="208">edits + reason</text>
  </g>

  <!-- THE VAULT lane -->
  <g>
    <rect x="484" y="336" width="152" height="76" class="shade"/>
    <rect x="478" y="330" width="152" height="76" class="card"/>
    <rect x="478" y="330" width="152" height="8" fill="#00e5ff"/>
    <text class="step" x="492" y="366">GET_BRIEFING</text>
    <text class="sub"  x="492" y="388">state + skills</text>
  </g>
  <g>
    <rect x="674" y="336" width="152" height="76" class="shade"/>
    <rect x="668" y="330" width="152" height="76" class="card"/>
    <rect x="668" y="330" width="152" height="8" fill="#00e5ff"/>
    <text class="step" x="682" y="366">READ_CODE</text>
    <text class="sub"  x="682" y="388">mirror @ 1 commit</text>
  </g>
  <g>
    <rect x="1284" y="336" width="152" height="76" class="shade"/>
    <rect x="1278" y="330" width="152" height="76" class="card"/>
    <rect x="1278" y="330" width="152" height="8" fill="#ff1a66"/>
    <text class="step" x="1292" y="366">REVIEW QUEUE</text>
    <text class="sub"  x="1292" y="388">nothing lands yet</text>
  </g>
  <g>
    <rect x="988" y="426" width="152" height="76" class="shade"/>
    <rect x="982" y="420" width="152" height="76" class="card"/>
    <rect x="982" y="420" width="152" height="8" fill="#00e5ff"/>
    <text class="step" x="996" y="456">CI MIRRORS</text>
    <text class="sub"  x="996" y="478">vault follows git</text>
  </g>

  <!-- THEIR AGENT lane -->
  <g>
    <rect x="1096" y="516" width="200" height="76" class="shade"/>
    <rect x="1090" y="510" width="200" height="76" class="card"/>
    <rect x="1090" y="510" width="200" height="8" fill="#ff1a66"/>
    <text class="step" x="1104" y="546">OWNER APPLIES + PUSHES</text>
    <text class="sub"  x="1104" y="568">in their own checkout</text>
  </g>

  <!-- ---------- the rule underneath ---------- -->
  <rect x="46" y="626" width="1500" height="52" fill="#0a0a0a"/>
  <rect x="40" y="620" width="1500" height="52" fill="#e5ff1a" stroke="#0a0a0a" stroke-width="3"/>
  <text class="note" x="60" y="652">THE VAULT NEVER WRITES TO GIT — an agent proposes, a human disposes. That single constraint is why someone else’s agent, with no repository access at all, can safely work on your code.</text>
</svg>
