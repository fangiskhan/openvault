<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1326" width="960" height="1326" role="img" aria-labelledby="t d">
<title id="t">How a change reaches your repo through OpenVault</title>
<desc id="d">A nine-step flow in four vertical lanes: the contributor, the vault, the owner, and git. The contributor prompts an agent, which reads a briefing, reads the code mirror, announces the work it plans, and files an anchored suggestion. The vault holds that suggestion in a review queue. The owner approves it, applies it in their own checkout and pushes to git. CI syncs the repository back into the mirror. A crossed-out line marks the one path that does not exist: the vault never writes to git.</desc>
