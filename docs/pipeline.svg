<text class="ttl" x="72" y="399">GET_BRIEFING</text>
<text class="det" x="72" y="420">state + project skills</text></g>
<g><rect x="31" y="478" width="234" height="74" fill="#0a0a0a"/>
<rect x="24" y="471" width="234" height="74" fill="#fff" stroke="#0a0a0a" stroke-width="3"/>
<rect x="24" y="471" width="234" height="9" fill="#e5ff1a"/>
<rect x="34" y="493" width="26" height="26" fill="#0a0a0a"/>
<text class="num" x="47" y="511" text-anchor="middle">3</text>
<text class="ttl" x="72" y="511">READ_CODE</text>
<text class="det" x="72" y="532">mirror at one commit</text></g>
<g><rect x="31" y="590" width="234" height="74" fill="#0a0a0a"/>
<rect x="24" y="583" width="234" height="74" fill="#fff" stroke="#0a0a0a" stroke-width="3"/>
