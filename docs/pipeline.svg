    .sub { font: 13px ui-monospace, "Cascadia Mono", Menlo, monospace; fill: #555; }
    .lane{ font: 800 17px "Segoe UI", Inter, system-ui, sans-serif; letter-spacing: 2.4px; fill: #0a0a0a; }
    .note{ font: 15px ui-monospace, "Cascadia Mono", Menlo, monospace; fill: #0a0a0a; }
    .hdr { font: 800 34px "Segoe UI", Inter, system-ui, sans-serif; letter-spacing: 7px; fill: #0a0a0a; }
    .wire{ fill: none; stroke: #0a0a0a; stroke-width: 3; }
  </style></defs>
