<rect x="53" y="689" width="2048" height="54" fill="#0a0a0a"/>
<rect x="46" y="682" width="2048" height="54" fill="#e5ff1a" stroke="#0a0a0a" stroke-width="3"/>
<text class="note" x="66" y="715">THE VAULT NEVER WRITES TO GIT — an agent proposes, a human disposes. That single constraint is why someone else’s agent, with no repository access at all, can safely work on your code.</text>
</svg>
